name: Publish private TrueNAS images

on:
  push:
    tags: ['truenas-*']

permissions:
  contents: read

concurrency:
  group: publish-truenas
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  publish:
    needs: tests
    if: github.repository == 'DenBond007/sopds'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/denbond007/sopds-app
      CADDY_IMAGE: ghcr.io/denbond007/sopds-caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require private packages before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/truenas/check-registry.py --owner DenBond007 --package sopds-app --package sopds-caddy --allow-missing
      - name: Log in to GHCR with the workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish both images from this commit
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$APP_IMAGE:sha-$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/app-image.json" \
            --push --file Dockerfile .
          docker buildx build --platform linux/amd64 --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$CADDY_IMAGE:sha-$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/caddy-image.json" \
            --push --file infra/docker/Caddy.Dockerfile infra/docker
      - name: Verify private access and package immutable references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/app-image.json")
          caddy_digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/caddy-image.json")
          python3 scripts/truenas/check-registry.py --owner DenBond007 \
            --package sopds-app --package sopds-caddy \
            --image "$APP_IMAGE@$app_digest" --image "$CADDY_IMAGE@$caddy_digest"
          python3 scripts/truenas/build-kit.py --mode registry \
            --app-image "$APP_IMAGE@$app_digest" --caddy-image "$CADDY_IMAGE@$caddy_digest" \
            --output .local/sopds-truenas-ghcr
          python3 .local/sopds-truenas-ghcr/control.py pull
          (cd .local/sopds-truenas-ghcr && sha256sum --check SHA256SUMS)
      - name: Save the configuration kit (no secrets or image layers)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sopds-truenas-ghcr-${{ github.ref_name }}
          path: |
            .local/sopds-truenas-ghcr.tar.gz
            .local/sopds-truenas-ghcr.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
