name: Remove initial GHCR publication
on:
  push:
    tags: ['ghcr-repair-2026.10.18.1']
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    if: github.repository == 'DenBond007/sopds'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove only the two versions created by the failed initial publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          expected = {
              'sopds-app': 'sha256:492417a284c567eea95eb350fe0117ca2fa47a0e36e4ca0dca647b88ee00f4b5',
              'sopds-caddy': 'sha256:b44c74cd914e23b8a1cdbcdbe307e8d0406127e8cd8d72227a83441a67c38cd9',
          }
          tag = 'sha-bd486b251c34fb4ca057928f7bbe6fe001bf86d2'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          for name, digest in expected.items():
              url = 'https://api.github.com/users/DenBond007/packages/container/' + name
              try:
                  with urlopen(Request(url, headers=headers), timeout=30) as r:
                      package = json.load(r)
              except HTTPError as error:
                  if error.code == 404:
                      print(name, 'already absent')
                      continue
                  raise
              print(json.dumps({key: package.get(key) for key in ('name', 'visibility', 'created_at', 'version_count')}))
              with urlopen(Request(url + '/versions?per_page=100', headers=headers), timeout=30) as r:
                  versions = json.load(r)
              assert len(versions) == 1, 'Refuse to delete unrelated versions'
              version = versions[0]
              assert version['name'] == digest, 'Unexpected digest'
              assert version['metadata']['container']['tags'] == [tag], 'Unexpected tags'
              assert package['visibility'] == 'public', 'Do not remove a private package'
              with urlopen(Request(url, headers=headers, method='DELETE'), timeout=30) as r:
                  assert r.status == 204
              print(name, 'removed the initial public package')
          PY
